name: Prepare MiniMax M3.1 contribution

on:
  push:
    branches: [data/minimax-m31-flash-preview-cn-20261001]
    paths:
      - .github/workflows/minimax-m31-prepare.yml

permissions:
  contents: write

concurrency:
  group: minimax-m31-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'klarkxy/real-api-pricing'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install build dependencies and chart font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r requirements.txt
          npm ci
          npm --prefix web ci
      - name: Apply reviewed source changes and explicit English chart labels
        run: |
          cp data/adopted.csv /tmp/adopted-before-m31.csv
          python scripts/prepare_minimax_m31_pr.py
          python - <<'PY'
          from pathlib import Path
          import ast
          path = Path('scripts/plot_quotas.py')
          text = path.read_text(encoding='utf-8')
          anchor = '        translations = {\n'
          assert text.count(anchor) == 1, 'Translation anchor changed; stop for review'
          additions = ''.join(
              f'            "MiniMax M Plan {tier} (CN{suffix})": "MiniMax M Plan {tier}{label}",\n'
              for tier in ('Go', 'Explore', 'Build')
              for suffix, label in (('', ''), (' Annual', ' (Annual)'))
          )
          text = text.replace(anchor, anchor + additions, 1)
          ast.parse(text)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Generate data and charts and run all checks
        run: |
          python scripts/build_adopted.py > /tmp/m31-build.log
          python scripts/checks/verify_minimax_m31.py
          python scripts/compute.py >> /tmp/m31-build.log
          python scripts/readme_stats.py
          python scripts/checks/verify_benchmark_configs.py
          python scripts/checks/verify_aa_snapshot.py
          python scripts/checks/verify_deepswe.py
          python scripts/plot_svg.py >> /tmp/m31-build.log
          node scripts/render_svg.cjs >> /tmp/m31-build.log
          python scripts/build_html.py >> /tmp/m31-build.log
          node scripts/checks/verify_configuration_html.cjs
          python scripts/plot_quotas.py >> /tmp/m31-build.log
          python scripts/checks/verify_fee_bands.py
          python scripts/checks/verify_chart_labels.py
          python scripts/publish_charts.py
          python scripts/checks/verify_svg.py
          python scripts/checks/verify_label_overlap.py
          python scripts/checks/verify_four_boards.py >> /tmp/m31-build.log
          python scripts/checks/verify_publication.py
          python scripts/checks/verify_palette.py
          python scripts/readme_stats.py --check
          python scripts/checks/verify_snapshot_date.py --base cef72b2da0d3f0bd8ac6799396b09f6d25ee9c7a
          npm --prefix web test
          npm --prefix web run build
          git diff --check
      - name: Ensure existing adopted points are unchanged
        run: |
          python - <<'PY'
          import csv
          def old_rows(path):
              with open(path, encoding='utf-8-sig', newline='') as f:
                  return {(r['plan_id'], r['served_model']): r for r in csv.DictReader(f)
                          if r['served_model'] != 'minimax-m3.1-flash-preview'}
          assert old_rows('/tmp/adopted-before-m31.csv') == old_rows('data/adopted.csv')
          print('PASS: all existing adopted rows unchanged')
          PY
      - name: Commit generated contribution
        run: |
          test "$(git branch --show-current)" = data/minimax-m31-flash-preview-cn-20261001
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/build_adopted.py scripts/compute.py scripts/plot_quotas.py scripts/minimax_m31_rows.py scripts/checks/verify_minimax_m31.py CONVENTIONS.md DECISIONS.md data derived charts README.md README.zh.md
          git commit -m 'Data: adopt provisional M3.1 CN monthly/annual points and regenerate outputs'
          git push origin HEAD:refs/heads/data/minimax-m31-flash-preview-cn-20261001
      - name: Print build-log tail on failure
        if: failure()
        run: tail -n 100 /tmp/m31-build.log || true
